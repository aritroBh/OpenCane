; CaneKit grip module — PlatformIO
;   pio run -e xiao_esp32s3 -t upload && pio device monitor
;
; Stretch / history only: the phone-only app does not use this firmware (canekit_grip.ino header).
; Two boards share the [env] block; build output goes to .pio/ (git-ignored: firmware/**/.pio/).
; src_dir = . because the Arduino IDE needs the .ino in a folder of the same name, so the sources
; sit beside this file instead of in src/. Never built in CI; no tests.
[platformio]
src_dir = .
default_envs = xiao_esp32s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
  h2zero/NimBLE-Arduino@^2.1.0
  pololu/VL53L1X@^1.3.1
build_flags =
  -DHAS_TOF=1              ; set to 0 to build without the VL53L1X driver

; Primary board (pin map: the ARDUINO_XIAO_ESP32S3 / ESP32S3 branch of canekit_grip.ino).
[env:xiao_esp32s3]
board = seeed_xiao_esp32s3

; Fallback board; its pin map is marked unverified in firmware/README.md. A local build_flags
; replaces the inherited one, hence ${env.build_flags} to keep -DHAS_TOF.
[env:esp32c3_supermini]
board = esp32-c3-devkitm-1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1      ; USB-CDC serial on the SuperMini's native USB port
  -DARDUINO_USB_CDC_ON_BOOT=1
