# CaneKit CI — runs on every push / PR.
#
#   logic-tests   the pure CaneKitLogic package (Swift Testing) — must pass.
#   sim-build     XcodeGen + simulator build of the phone app — informational until GitHub's
#                 hosted runners ship Xcode 27 (the app targets iOS 26; Xcode 26 builds it, but
#                 the runner image may lag). `continue-on-error` keeps it from blocking merges.
#
# Nothing here signs or touches a device; Secrets.plist is never present on CI (gen.sh copies the
# example file, all keys empty, and the app is built to tolerate that).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic-tests:
    name: CaneKitLogic unit tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          swift --version
      - name: swift test
        working-directory: ios/Logic
        run: swift test

  sim-build:
    name: Simulator build (informational)
    runs-on: macos-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project (phone-only, no watch embed)
        working-directory: ios
        run: WATCH=0 scripts/gen.sh
      - name: Build for the iOS simulator
        working-directory: ios
        run: make sim
