# CaneKit — XcodeGen project spec.
# Regenerate with `scripts/gen.sh` (never edit CaneKit.xcodeproj by hand; it is git-ignored).
#
# Targets
#   CaneKit        iPhone app (iOS 26+)          bundle id com.aritro.canekit
#   CaneKitWatch   watchOS companion (26+)       bundle id com.aritro.canekit.watchkitapp
#   CaneKitWidget  Live Activity extension       bundle id com.aritro.canekit.widget   [added in step 9]
# All three share the pure-logic SwiftPM package in ./Logic.
#
# The name split (deliberate — see AGENTS.md → "The name split"):
#   What a HUMAN sees/hears  = OpenCane. That is `CFBundleDisplayName` on all three targets (home
#     screen, Settings, the Files app folder, and the word Siri matches in an App Shortcut phrase,
#     because `\(.applicationName)` resolves to the display name).
#   What the CODE is called  = CaneKit. Project name, target names, `PRODUCT_NAME`, the SwiftPM
#     module `CaneKitLogic`, the scheme, every `ios/CaneKit/…` path and the Makefile all stay
#     CaneKit, and the bundle ids stay `com.aritro.canekit*` (frozen — hard rule 6: a new id makes
#     iOS treat this as a different app and orphans the installed build, its settings and the
#     ElevenLabs voice cache).
#   Do NOT "fix" the mismatch by renaming targets or `PRODUCT_NAME`: `PRODUCT_NAME` names the
#   built `CaneKit.app`, which the Makefile, gen.sh and scripts/e2e.py all reference by path.
#
# Signing: automatic, personal team. DEVELOPMENT_TEAM is passed on the xcodebuild command line
# (see Makefile / local.mk) so this file never carries a team id.
#
# Concurrency: Swift 6 language mode with Xcode 26 "approachable concurrency" defaults
# (everything is MainActor unless it opts out with `nonisolated`). Only the ARKit frame
# processor and the network clients opt out.

name: CaneKit

options:
  bundleIdPrefix: com.aritro
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

packages:
  CaneKitLogic:
    path: Logic

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: "YES"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    WATCHOS_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1"

targets:

  # ───────────────────────────── iPhone app ─────────────────────────────
  CaneKit:
    type: application
    platform: iOS
    sources:
      - path: CaneKit
        excludes:
          - "Resources/Secrets.plist"     # copied in as a build resource below so a missing file is not fatal
      - path: CaneKit/Resources/Secrets.plist
        optional: true
        buildPhase: resources
      - path: Shared/LiveActivity
    dependencies:
      - package: CaneKitLogic
      - target: CaneKitWatch
        embed: true
      - target: CaneKitWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aritro.canekit
        PRODUCT_NAME: CaneKit
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
        CODE_SIGN_ENTITLEMENTS: CaneKit/CaneKit.entitlements
    info:
      path: CaneKit/Info.plist
      properties:
        CFBundleDisplayName: OpenCane
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit, arm64]
        UIBackgroundModes: [audio, location]
        # Trip logs (JSONL) and the hazard map (GeoJSON + photos) in Documents show up in the
        # Files app → On My iPhone → OpenCane (the display name, not the target name; review:
        # they were unreachable on the phone).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        # Purpose strings — the system shows these on first use.
        NSCameraUsageDescription: "OpenCane uses the camera and LiDAR to detect obstacles between your waist and head."
        NSLocationWhenInUseUsageDescription: "OpenCane uses your location and heading to guide you along the route."
        NSMotionUsageDescription: "OpenCane uses motion to tell when the cane is sweeping, to track your head direction with AirPods, and to count steps."
        NSSpeechRecognitionUsageDescription: "OpenCane can take spoken commands."
        # Sound recognition (SoundAnalysis) is the real microphone user: sirens, horns and vehicle
        # sounds a blind pedestrian cannot see coming. Off by default (Hazards card switch), and it
        # is the one feature that moves the audio session to .playAndRecord — see SoundWatcher.
        NSMicrophoneUsageDescription: "OpenCane can listen for sirens, car horns and vehicle sounds to warn you about traffic you cannot see, and for spoken commands."
        NSHealthShareUsageDescription: "OpenCane reads your step count for the arrival summary."
        NSHealthUpdateUsageDescription: "OpenCane records the guided walk as a workout so the watch can keep giving cues."

  # ───────────────────────────── Watch app ─────────────────────────────
  CaneKitWatch:
    type: application
    platform: watchOS
    sources:
      - path: CaneKitWatch
    dependencies:
      - package: CaneKitLogic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aritro.canekit.watchkitapp
        PRODUCT_NAME: CaneKit
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: CaneKitWatch/CaneKitWatch.entitlements
    info:
      path: CaneKitWatch/Info.plist
      properties:
        CFBundleDisplayName: OpenCane
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.aritro.canekit
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [workout-processing, mindfulness]   # workout keep-alive + runtime-session fallback
        NSMotionUsageDescription: "OpenCane counts steps for the arrival summary."
        NSHealthShareUsageDescription: "OpenCane reads your step count for the arrival summary."
        NSHealthUpdateUsageDescription: "OpenCane records the guided walk as a workout so wrist cues keep working."

  # ───────────────────────────── Live Activity widget ─────────────────────────────
  CaneKitWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CaneKitWidget
      - path: Shared/LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aritro.canekit.widget
        PRODUCT_NAME: CaneKitWidget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
    info:
      path: CaneKitWidget/Info.plist
      properties:
        CFBundleDisplayName: OpenCane
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ───────────────────────────── UI tests (simulator) ─────────────────────────────
  CaneKitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CaneKitUITests
    dependencies:
      - target: CaneKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aritro.canekit.uitests
        TEST_TARGET_NAME: CaneKit
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  CaneKit:
    build:
      targets:
        CaneKit: all
        CaneKitUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CaneKitUITests
    archive:
      config: Release
  CaneKitWatch:
    build:
      targets:
        CaneKitWatch: all
    run:
      config: Debug
